[workspace]
resolver = "3"
members = ["crates/memoria", "crates/protocolo", "crates/servidor", "drivers/remoteid"]
# O clone do RemoteID-linux que scripts/remoteid.sh faz é um projeto à parte.
exclude = ["target/deps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
memoria = { path = "crates/memoria" }
protocolo = { path = "crates/protocolo" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

# O Argon2id do PIN pessoal sem otimização leva centenas de milissegundos por
# conferência e deixa os testes lentos.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
