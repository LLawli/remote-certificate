[workspace]
resolver = "3"
members = ["crates/protocolo", "crates/servidor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
protocolo = { path = "crates/protocolo" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"
