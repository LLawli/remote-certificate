[package]
name = "servidor"
description = "Serviço que compartilha tokens A3 e certificados em nuvem pela rede"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "remote-certificate"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
data-encoding = "2"
getrandom = { version = "0.3", features = ["std"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
memoria.workspace = true
protocolo.workspace = true
rede.workspace = true
rustix = { version = "1", features = ["termios"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# SQLCipher com o OpenSSL compilado junto: a imagem final não precisa de libssl.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zeroize.workspace = true

[dev-dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[lints]
workspace = true
