[package]
name = "driver-remoteid"
description = "Driver do RemoteID (Certisign) para o remote-certificate, sobre o remoteid servir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "remote-certificate-driver-remoteid"
path = "src/main.rs"

[dependencies]
protocolo.workspace = true
base64.workspace = true
getrandom = { version = "0.3", features = ["std"] }
memoria.workspace = true
serde_json.workspace = true
sha2 = "0.11"

[dev-dependencies]
rede = { path = "../../crates/rede" }
servidor = { path = "../../crates/servidor" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha1 = "0.11"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
ureq = "3"

[lints]
workspace = true
